<!DOCTYPE html>
<html lang="en">
  <head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.10.0/p5.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.10.0/addons/p5.sound.min.js"></script>
    <link rel="stylesheet" type="text/css" href="style.css">
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" href="../src/mushroom.png">
    <title>Draging Objects</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Jersey+20&family=Pixelify+Sans:wght@400..700&family=Rampart+One&display=swap" rel="stylesheet">
  </head>
  <body>
    <main>
      <h1>Draging Objects: Drags Shape to Designated Area</h1>
      <div id="notification">
        <p id="score">Score: 0</p>
        <p id="result">Run game</p>
        <p id="timer">Timer: 0</p>
      </div>
    </main>
    <div id="finish">
      <p>GAME OVER</p>
      <p id="currentscore">_</p>
      <p id="bestscore">_</p>
    </div>
    <button id="start"><p>Start</p></button>
    <div id="quitPrompt">
      <div>Do you want to leave the game? </div>
      <div class="quitPromptAnwser">
        <a href="../index.html"><button id="yes">Yes</button></a>
        <button id="no">No</button>
      </div>
    </div>
    <footer>
      <div id="volumnPrompt"> 
        <img src="../src/volume.png" class="function"/>
        <input id="volumn" name="volumn" type="range" min="0" max="100"/>
      </div>
      <img src="../src/door.png" alt="quit" id="quit"  class="function"/>
    </footer>
    <script src="sketch.js"></script>
  </body>
</html>
